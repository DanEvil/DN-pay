name: MirWallet
options:
  bundleIdPrefix: com.dnpay
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  MirWallet:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: MirWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dnpay.mirwallet
        PRODUCT_NAME: MirWallet
        INFOPLIST_FILE: MirWallet/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MirWallet/Resources/MirWallet.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - MirWalletTests

  MirWalletTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: MirWalletTests
    dependencies:
      - target: MirWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dnpay.mirwallet.tests
        GENERATE_INFOPLIST_FILE: YES
